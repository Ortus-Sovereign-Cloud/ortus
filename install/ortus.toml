# Ortus settings. Every setting can also be given as an ORTUS_* variable in
# /etc/ortus/ortus.env, which wins over this file. Secrets (database
# passwords, S3 keys) belong in ortus.env.
#
# The secrets Ortus keeps in its database are sealed with the key in
# data_dir/secrets.key (made on the first start), or ORTUS_SECRETS_KEY in
# ortus.env. Keep a copy of it somewhere safe: backups never carry it, and
# a restore needs it.

roles = ["all"]
data_dir = "/var/lib/ortus"

[web]
# Ortus listens here; put a TLS reverse proxy in front of it.
ip = "127.0.0.1"
port = 7878
# The address people reach the installation at, through the proxy: links
# in mail, the setup link, passkeys and invitations use it. Set it before
# the first start.
# public_url = "https://ortus.example.org"

# PostgreSQL instead of SQLite in data_dir:
# [database]
# url = "postgres://ortus@db.example.org/ortus"

# S3 instead of a directory in data_dir:
# [files.s3]
# endpoint = "https://s3.example.org"
# bucket = "ortus"
