# A release: for a tag vX.Y.Z on main whose CI passed, every program for
# x86-64 and arm64 Linux (static, musl), each in an archive with the install
# files and the licences, SHA256SUMS over them, and the container image of
# `ortus` for both machines (tagged vX.Y.Z and X.Y.Z, which the chart uses).
# The sums and the image are signed keylessly (Sigstore): the certificate
# names this workflow at the tag. Only the publish and image jobs can sign
# or write; the build jobs, which run third-party build code, get neither.
#
# Run by hand it is a dry run: built and signed (the certificate names a
# branch, which the guide's check refuses), kept as CI artifacts; nothing
# is released and no image is pushed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  # A real release: a pushed tag, never a run by hand.
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main and its CI passed
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "release: $GITHUB_SHA is not on main" >&2; exit 1; }
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --commit "$GITHUB_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "$ok" -ge 1 ] || { echo "release: CI did not pass on $GITHUB_SHA" >&2; exit 1; }

  build:
    needs: gate
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: The pinned parts
        run: ci/fetch.sh
      - name: Static programs
        run: |
          for program in ortus ortus-mail ortus-drive ortus-chat; do
            ci/image.sh "$program" "build-$program"
            id=$(docker create "build-$program")
            mkdir -p "out/$program"
            docker cp "$id:/ortus" "out/$program/$program"
            docker rm "$id"
          done
      - name: Archives
        env:
          REF: ${{ github.ref_name }}
        run: |
          python3 tools/licences.py > LICENSES.md
          version="${REF//\//-}"
          for program in ortus ortus-mail ortus-drive ortus-chat; do
            dir="$program-$version-${{ matrix.arch }}-linux"
            mkdir -p "dist/$dir"
            cp "out/$program/$program" "dist/$dir/ortus"
            cp -r install LICENSE-APACHE LICENSE-MIT LICENSES.md README.md "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          done
      - name: The ortus image of this machine
        run: docker save build-ortus | gzip > image-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archives-${{ matrix.arch }}
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sums and their signature
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
      - name: Check the signature as the guide says
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          if [ "$PUBLISH" = true ]; then identity="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v"; else identity="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@"; fi
          cosign verify-blob --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: dist
      - name: The release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          python3 tools/licences.py > LICENSES.md
          gh release create "$REF" dist/* --title "Ortus $REF" --notes-file LICENSES.md --verify-tag

  image:
    # The images the build jobs made natively on each machine, joined into
    # one image for both (no emulated build).
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Both machines' images load and run
        run: |
          for arch in x86_64 aarch64; do
            gunzip -c "image-$arch.tar.gz" | docker load
            docker tag build-ortus "ortus-$arch"
            docker image inspect "ortus-$arch" --format "$arch: {{.Os}}/{{.Architecture}}"
          done
          docker run --rm ortus-x86_64 version
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: One image for both machines, signed
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ github.ref_name }}
        run: |
          repo=ghcr.io/ortus-sovereign-cloud/ortus
          docker tag ortus-x86_64 "$repo:$REF-amd64"
          docker tag ortus-aarch64 "$repo:$REF-arm64"
          docker push "$repo:$REF-amd64"
          docker push "$repo:$REF-arm64"
          docker buildx imagetools create -t "$repo:$REF" -t "$repo:${REF#v}" "$repo:$REF-amd64" "$repo:$REF-arm64"
          digest=$(docker buildx imagetools inspect "$repo:$REF" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          cosign sign --yes "$repo@$digest"
