# A release: for a tag vX.Y.Z on main, every program for x86-64 and arm64
# Linux (static, musl), each in an archive with the install files and the
# licences, SHA256SUMS over them, the container image of `ortus` for both
# machines, and keyless signatures (Sigstore) of the sums and the image,
# naming this workflow. Nothing else signs Ortus releases.
name: release

on:
  push:
    tags: ["v*"]
  # A dry run: everything built and signed, kept as CI artifacts; no
  # release, no image pushed.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: The pinned parts
        run: ci/fetch.sh
      - name: Static programs
        run: |
          for program in ortus ortus-mail ortus-drive ortus-chat; do
            ci/image.sh "$program" "build-$program"
            id=$(docker create "build-$program")
            mkdir -p "out/$program"
            docker cp "$id:/ortus" "out/$program/$program"
            docker rm "$id"
          done
      - name: Archives
        run: |
          python3 tools/licences.py > LICENSES.md
          version="${GITHUB_REF_NAME//\//-}"
          for program in ortus ortus-mail ortus-drive ortus-chat; do
            dir="$program-$version-${{ matrix.arch }}-linux"
            mkdir -p "dist/$dir"
            cp "out/$program/$program" "dist/$dir/ortus"
            cp -r install LICENSE-APACHE LICENSE-MIT LICENSES.md README.md "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Sums and their signature
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist
      - name: Check the signature as the guide says
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          cosign verify-blob --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - name: The release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Ortus $GITHUB_REF_NAME" --notes-file LICENSES.md --verify-tag

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image for both machines, signed
        run: |
          ci/fetch.sh
          image="ghcr.io/ortus-sovereign-cloud/ortus:${GITHUB_REF_NAME//\//-}"
          ci/stage.sh stage
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            # The dry run builds both machines' image and pushes nothing.
            docker buildx build --platform linux/amd64,linux/arm64 --build-arg PROGRAM=ortus -t "$image" stage
            exit 0
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg PROGRAM=ortus -t "$image" --push stage
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          cosign sign --yes "ghcr.io/ortus-sovereign-cloud/ortus@$digest"
