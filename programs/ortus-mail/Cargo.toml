[package]
name = "ortus-program-mail"
description = "Ortus mail, calendar and contacts, on their own."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ortus-mail"
path = "src/main.rs"

[dependencies]
ortus-core = { workspace = true }
ortus-mail = { workspace = true }
ortus-calendar = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
