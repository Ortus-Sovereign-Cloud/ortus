[package]
name = "ortus-program-drive"
description = "Ortus drive and docs, on their own."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ortus-drive"
path = "src/main.rs"

[dependencies]
ortus-core = { workspace = true }
ortus-drive = { workspace = true }
ortus-docs = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
